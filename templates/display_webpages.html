<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>WEBPAGE TABLE</h1></center>
     <center>
        <table border="3px">
        <tr>
            <th>id</th>
            <th>topic_name</th>
            <th>name</th>
            <th>url</th>
            <th>email</th>
            <th>mobile</th>
            <th>about</th>
        </tr>
        {% for wo in Webpages %}
        <tr>
            <td>{{ wo.id }}</td>
            <td>{{ wo.topic_name.topic_name }}</td>
            <td>{{ wo.name }}</td>
            <td>{{ wo.url }}</td>
            <td>{{ wo.email }}</td>
            <td>{{ wo.mobile }}</td>
            <td>{{ wo.about }}</td>
        </tr>
        {% endfor %}



     </center>

    </table>
    
</body>
</html>
