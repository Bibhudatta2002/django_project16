<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>checkbox</h1>
        <form action="{% url 'select_multiple' %}" method="post"></form>
        {% csrf_token %}
        <h4>select your topic</h4>
        {% for  TO in QSLTO %}
            <label for="topics">{{TO.topic_name}}</label>
            <input type="checkbox" name="topics" id="topics" value="{{TO.topic_name}}">
            <br><br>
        {% endfor %}
        <input type="submit" value="submit">
    </center>
    
</body>
</html>
